# Docker Compose configuration for ARGscape development environment
# Provides hot-reload development setup for both frontend and backend
# 
# Usage:
#   docker compose up --build      # Start both services with build
#   docker compose down            # Stop all services
#
# Access points:
#   Frontend: http://localhost:5173
#   Backend:  http://localhost:8000
#   API Docs: http://localhost:8000/docs

version: '3.8'

networks:
  default:
    name: argscape-network
    driver: bridge

services:
  # Frontend React application (Vite dev server with hot-reload)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Anonymous volume to prevent node_modules overwrite
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  # Backend FastAPI application (uvicorn with hot-reload)
  backend:
    build:
      context: .
      dockerfile: ./argscape/api/Dockerfile
      target: development
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/argscape/__pycache__  # Prevent cache pollution
    environment:
      - ENV=development
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    restart: unless-stopped